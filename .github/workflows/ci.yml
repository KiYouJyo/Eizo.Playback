name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Eizo.Playback.slnx

      - name: Build
        run: dotnet build Eizo.Playback.slnx --configuration Release --no-restore

      - name: Test
        timeout-minutes: 5
        run: dotnet test Eizo.Playback.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Eizo.Playback.slnx --configuration Release --no-build --output artifacts/packages

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $expected = @(
            'Eizo.Playback.Abstractions.0.1.0.nupkg',
            'Eizo.Playback.Core.0.1.0.nupkg',
            'Eizo.Playback.LibVLC.0.1.0.nupkg',
            'Eizo.Playback.LibVLC.WinUI.0.1.0.nupkg'
          )

          $packages = Get-ChildItem artifacts/packages/*.nupkg
          $actual = @($packages | ForEach-Object Name | Sort-Object)
          $wanted = @($expected | Sort-Object)

          if (Compare-Object $wanted $actual) {
            throw "Unexpected NuGet package set. Expected: $($wanted -join ', '); actual: $($actual -join ', ')"
          }

          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entries = @($archive.Entries | ForEach-Object FullName)
              if ($entries -notcontains 'README.md') {
                throw "$($package.Name) does not contain README.md"
              }
              if (-not ($entries | Where-Object { $_ -like '*.nuspec' })) {
                throw "$($package.Name) does not contain a nuspec"
              }

              if ($package.Name -eq 'Eizo.Playback.LibVLC.WinUI.0.1.0.nupkg') {
                if ($entries | Where-Object { $_ -like '*.pri' }) {
                  throw 'Eizo.Playback.LibVLC.WinUI package must not contain PRI files.'
                }

                $nuspecEntry = $archive.Entries |
                  Where-Object { $_.FullName -like '*.nuspec' } |
                  Select-Object -First 1

                $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
                try {
                  $nuspecText = $reader.ReadToEnd()
                }
                finally {
                  $reader.Dispose()
                }

                if ($nuspecText -match 'LibVLCSharp\.WinUI') {
                  throw 'Eizo.Playback.LibVLC.WinUI must not depend on LibVLCSharp.WinUI.'
                }
              }
            }
            finally {
              $archive.Dispose()
            }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: eizo-playback-nuget-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
