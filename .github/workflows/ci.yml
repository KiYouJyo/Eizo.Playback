name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Eizo.Playback.slnx

      - name: Build
        run: dotnet build Eizo.Playback.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Eizo.Playback.slnx --configuration Release --no-build
